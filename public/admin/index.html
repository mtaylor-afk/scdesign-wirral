<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SC Design Wirral — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <!-- Login screen -->
  <div id="login">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="brand">SC Design <span>Wirral</span></div>
      <div class="sub">Admin &amp; analytics portal</div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn-block" type="submit" id="loginBtn">Sign in</button>
      <div class="login-err" id="loginErr"></div>
      <div class="login-foot">Authorised access only · cookieless, privacy-first analytics</div>
    </form>
  </div>

  <!-- App shell -->
  <div id="app" class="hidden">
    <aside class="sidebar" id="sidebar" aria-label="Admin sections"></aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-row">
          <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div class="topbar-title">
            <h1 id="pageTitle">Today</h1>
            <div class="meta" id="pageMeta"></div>
          </div>
          <div class="controls">
            <!-- Range and bots are shown only on the views that use them; see
                 renderToolbar() in admin.js. -->
            <div class="seg" id="rangeSeg" hidden></div>
            <label class="toggle" id="botsWrap" hidden><input type="checkbox" id="botsToggle" /> Show bots</label>
            <span class="lastupd" id="lastUpdated" title="How recently this page fetched its data">Live</span>
            <button class="btn-ghost btn btn-sm" id="refreshBtn">Refresh</button>
          </div>
        </div>
        <nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>
      </header>
      <main class="content" id="view">
        <div class="loader">Loading…</div>
      </main>
    </div>
  </div>

  <!-- Error capture first, so it also catches admin.js init failures. -->
  <script src="./error-capture.js"></script>
  <!-- image-prep.js and projects.js must run BEFORE admin.js, which reads
       window.SCImagePrep / window.SCProjects as it wires its views. -->
  <script src="./image-prep.js" defer></script>
  <script src="./projects.js" defer></script>
  <script src="./admin.js" defer></script>
</body>
</html>
