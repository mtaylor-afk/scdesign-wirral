name: Temporary - does Cloudflare build a GITHUB_TOKEN commit?

# One-off check for the cms-publish design; removed once it has answered.
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-token-check.yml"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a scratch file with the job's own token
        run: |
          report() { while IFS= read -r l; do echo "::warning::$1: $l"; done; }
          set +e
          date -u > docs/.cms-token-check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.cms-token-check.txt 2>&1 | report add
          git commit -m "chore: temporary check that a GITHUB_TOKEN commit triggers the Cloudflare build" 2>&1 | report commit
          for i in 1 2 3 4 5; do
            git pull --rebase origin main 2>&1 | report "pull $i"
            if git push origin HEAD:main > push.log 2>&1; then echo "::notice::pushed $(git rev-parse HEAD)"; exit 0; fi
            report "push $i" < push.log
            sleep 5
          done
          exit 1
