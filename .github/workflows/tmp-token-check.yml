name: Temporary - does Cloudflare build a GITHUB_TOKEN commit?

# One-off check for the cms-publish design; removed in the next commit.
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-token-check.yml"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > docs/.cms-token-check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.cms-token-check.txt
          git commit -m "chore: temporary check that a GITHUB_TOKEN commit triggers the Cloudflare build"
          # main can move while this runs (another session pushing), so rebase and retry.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
