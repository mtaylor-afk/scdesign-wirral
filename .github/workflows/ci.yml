name: CI

# Enforces the "tsc + ESLint + build pass clean" premise the codebase relies on.
# Note: pushes to main also auto-deploy (Cloudflare Pages + Vercel) independently
# of this workflow — add a branch-protection rule requiring "validate" if you want
# it to gate merges. NEVER run `npm audit fix --force` (it would downgrade Next 16).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck + lint + build
        run: npm run validate
      - name: WV Roofing type check + test suites (incl. sample estimates in step with products.json)
        run: npm run -s wvr:check && npm run -s wvr:test
      - name: Dependency audit (report only — vuln fixes are owner-timed)
        run: npm audit --audit-level=high || true
