name: WV Roofing live check

# Runs the WV Roofing browser QA against the deployed site in --live mode:
# forms are filled in but never sent, no renders are made and there is no
# operator login, so nothing reaches the roofer or costs money. The test photo
# it uploads is deleted again at the end. Run it from the Actions tab
# ("Run workflow") after a push; screenshots are kept as the run's artifact.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Site to check
        default: https://scdesignwirral.co.uk

# Read-only: the job only checks out the code and reports.
permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Health
        run: |
          curl -sS https://scdesign-wirral.vercel.app/api/wvroofing/health > health.json || true
          node scripts/wvroofing/qa-annotate.mjs --health health.json
      # Failures, skips and the total are also posted as annotations (scripts/wvroofing/qa-annotate.mjs),
      # so they can be read from the run's page (or the API) without opening the log.
      - name: Live QA
        env:
          BASE: ${{ inputs.base }} # passed as data, never spliced into the script
        run: |
          set +e
          node scripts/wvroofing/qa.mjs --base "$BASE" --live --out qa-out 2>&1 | tee qa.log
          status=${PIPESTATUS[0]}
          node scripts/wvroofing/qa-annotate.mjs qa.log "$status"
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wvroofing-live-qa
          path: qa-out
