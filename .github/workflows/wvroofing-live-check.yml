name: WV Roofing live check

# Runs the WV Roofing browser QA against the deployed site in --live mode:
# forms are filled in but never sent, no renders are made and there is no
# operator login, so nothing reaches the roofer or costs money. The test photo
# it uploads is deleted again at the end. Run it from the Actions tab
# ("Run workflow") after a push; screenshots are kept as the run's artifact.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Site to check
        default: https://scdesignwirral.co.uk

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Health
        run: echo "::notice title=health::$(curl -sS https://scdesign-wirral.vercel.app/api/wvroofing/health)"
      # Failures, skips and the total are also posted as annotations, so they can
      # be read from the run's page (or the API) without opening the log.
      - name: Live QA
        run: |
          set +e
          node scripts/wvroofing/qa.mjs --base "${{ inputs.base }}" --live --out qa-out 2>&1 | tee qa.log
          status=${PIPESTATUS[0]}
          # GitHub shows at most 10 errors per step: the first 9 in full, then every failure's name in one.
          grep '^FAIL' qa.log | head -9 | cut -c1-900 | sed 's/^/::error::/'
          if [ "$(grep -c '^FAIL' qa.log)" -gt 9 ]; then
            echo "::error title=all failures::$(grep '^FAIL' qa.log | sed 's/ - .*//' | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          grep '^SKIP' qa.log | head -10 | sed 's/^/::warning::/'
          tail -1 qa.log | sed 's/^/::notice title=result::/'
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wvroofing-live-qa
          path: qa-out
